<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habesha Eatery — Menu Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
   <article class="menu-card">
  <img 
    src="images.jpeg" 
    alt="Doro Wat — spiced chicken stew with boiled egg and injera" 
    class="menu-card__image"
  >

  <div class="menu-card__content">
    <h2 class="menu-card__name">Doro Wat</h2>
    <p class="menu-card__desc">
      Spiced chicken stew simmered in a rich berbere sauce, served
      with a boiled egg and warm injera.
    </p>
    <p class="menu-card__price">850</p>

    <ul class="menu-card__ingredients">
      <li>Chicken</li>
      <li>Berbere spice blend</li>
      <li>Boiled egg</li>
      <li>Red onions</li>
      <li>Niter kibbeh (spiced butter)</li>
      <li>Injera</li>
    </ul>
  </div>
</article>
</body>
</html>
