<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Eats | Traditional Food Ordering</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header>
    <div class="header-container">
      <h1>Addis Eats</h1>
      <p class="tagline">Authentic Ethiopian Cuisine delivered to your door</p>
      <input type="text" id="search" placeholder="Search dishes (e.g., Doro Wat, Shiro)..." aria-label="Search dishes">
    </div>
  </header>

  <main>
   
    <section id="menu" aria-label="Menu">
      
    </section>

    <aside id="cart" aria-label="Your order">
      <h2>Your Order</h2>
      <div id="cart-items">
        <p class="empty-cart">Your cart is empty</p>
      </div>
      <div class="cart-summary">
        <div class="total-row">
          <span>Total:</span>
          <strong id="cart-total">0 ETB</strong>
        </div>
        <button id="checkout-btn" class="checkout-btn">Proceed to TeleBirr Checkout</button>
      </div>
    </aside>
  </main>

  <footer>
    <p>Bole, Addis Ababa</p>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
