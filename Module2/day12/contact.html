<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Habesha Eatery, Bole</title>
  <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa, and check our opening hours.">
</head>
<body>

  <header>
    <h1>Contact Habesha Eatery</h1>
  </header>

  <nav>
    <a href="index.html">Reservations</a> ·
    <a href="contact.html">Contact</a>
  </nav>

  <main>

    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading">Send Us a Message</h2>

      <!-- Using method="post" for the same reason as the reservation form:
           this submits new data (a message) rather than requesting a resource. -->
      <form action="/contact" method="post">

        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send message</button>
      </form>
    </section>

    <section aria-labelledby="hours-heading">
      <h2 id="hours-heading">Opening Hours</h2>

      <table>
        <caption>Habesha Eatery — opening hours</caption>
        <thead>
          <tr>
            <th scope="col">Day</th>
            <th scope="col">Hours</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Monday – Friday</th>
            <td>11:00 – 22:00</td>
          </tr>
          <tr>
            <th scope="row">Saturday</th>
            <td>10:00 – 23:00</td>
          </tr>
          <tr>
            <th scope="row">Sunday</th>
            <td>10:00 – 21:00</td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>

  <footer>
    <p>Habesha Eatery · Bole, Addis Ababa</p>
  </footer>

</body>
</html>
